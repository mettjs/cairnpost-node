name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check / tests / build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The package as a user gets it: installed elsewhere, then used.
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/cairnpost-*.tgz
          node --input-type=module -e 'import { CairnPost, Verifier, version } from "cairnpost"; new CairnPost("https://mail.example.com", "key"); console.log(version, typeof Verifier);'

  integration:
    name: against a CairnPost server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cairnpost
          POSTGRES_PASSWORD: cairnpost
          POSTGRES_DB: cairnpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cairnpost -d cairnpost"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CAIRNPOST_IMAGE: ghcr.io/mettjs/cairnpost:0.1.1
      CAIRNPOST_POSTGRES_DSN: postgres://cairnpost:cairnpost@127.0.0.1:5432/cairnpost?sslmode=disable
      CAIRNPOST_INBOUND_SECRET: an-inbound-secret-for-the-tests-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - name: Start a CairnPost server that sends nothing
        run: |
          docker run -d --name cairnpost --network host \
            -e CAIRNPOST_POSTGRES_DSN -e CAIRNPOST_INBOUND_SECRET \
            -e CAIRNPOST_DRIVER=capture -e CAIRNPOST_ADDR=127.0.0.1:8025 \
            -e CAIRNPOST_WEBHOOK_ALLOW_PRIVATE=on -e CAIRNPOST_CONTENT_RETENTION=24h \
            -e CAIRNPOST_WEBHOOK_POLL=1s "$CAIRNPOST_IMAGE"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8025/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8025/health
          keys() { docker run --rm --network host -e CAIRNPOST_POSTGRES_DSN "$CAIRNPOST_IMAGE" keys create "$@"; }
          send=$(keys -name "ci send"); admin=$(keys -name "ci admin" -scope admin)
          echo "::add-mask::$send"; echo "::add-mask::$admin"
          { echo "CAIRNPOST_URL=http://127.0.0.1:8025"; echo "CAIRNPOST_SEND_KEY=$send"; echo "CAIRNPOST_ADMIN_KEY=$admin"; } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - if: failure()
        run: docker logs cairnpost
